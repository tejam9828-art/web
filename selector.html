<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*element selector*/
        p{
            color:rgb(236, 88, 47);
        }
        /* class selector*/
        .highlight {
            color:blue;
            background-color: burlywood;

        }
        /* id selector*/
        #special{
            color: rgb(14, 212, 230);
            font-size: 25px;
        }
    </style>
</head>
<body>
<h1>This file is used for selectors</h1>
<!--element selector-->
<p>now this the first trial for me</p>

<!--class selector-->
<p class="highlight"> this is highlighted text.</p>
<h2 class="highlighted"> this heading also uses the class.</h2>
    <!--id selector-->
    <p id="special">this is special text.</p>
</body>
</html>
