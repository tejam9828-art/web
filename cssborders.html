<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: chocolate;
        }
        p{
            color: rgb(116, 5, 116);
        }
        .box1{
            border: 3px dashed rgb(232, 20, 207);
            border-radius: 15px;
    
        }
        .box2{
            border: 3px dotted rgb(29, 41, 213);
            border-radius: 15px;
        }
        .box3{
            border: 3px double rgb(45, 224, 72);
            border-radius: 15px;
        }
        .box4{
            border: 3px solid salmon;
            border-radius: 15px;
            
        }
    </style>
</head>
<body>
    <h1> CSS BOARDERS</h1>
    <p> This paragraph has a solid  border.</p>
    <p class="box1"> this is dashed border</p>
    <p class="box2"> This is dotted border</p>
    <p class="box3">this is double border</p>
    <p class="box4">This is round border</p>
</body>
</html>
